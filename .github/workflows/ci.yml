name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Exact source for the Rust HTTP bridge used by the native Kotlin/JVM Iroh
  # integration lane. Keep this pinned so Rust main cannot change Java CI.
  VGI_RPC_IROH_RUST_REV: 9e7dfb59686682be0ff4a46183988e2724416393

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # ./gradlew (the POSIX launcher script) needs bash; windows-latest
        # defaults to pwsh, but Git Bash ships on the runner. Linux/macOS are
        # bash already, so this is a no-op there.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Linux x64 + macOS arm64 + Windows x64 (all supported targets). macOS is
        # not redundant: the POSIX shm overlay (FfmShm) has an explicit Darwin
        # branch — different shm_open(2) open flags than Linux — that the ubuntu
        # lane never exercises. Windows has no POSIX shm, so its lane proves the
        # library degrades to the pure-JVM pipe/HTTP path (shm unadvertised); the
        # FFM-overlay lanes are skipped there (see `if:` guards below).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Install three runtimes and hand Gradle their exact paths. The build
      # toolchain is JDK 25 (it compiles the release-21 baseline AND the
      # release-22 multi-release shared-memory overlay); the 22 and 21 installs
      # back the runtime-retargeting test lanes below. Passing
      # `installations.paths` (vs. the JAVA_HOME_*_<arch> env vars) keeps this
      # architecture-independent — those env vars are _X64 on the Linux runner
      # but _ARM64 on the macOS runner. Listing 21 last makes it JAVA_HOME, so
      # the Gradle launcher itself runs on 21 while the 25 toolchain compiles.
      - name: Set up JDK 25
        id: jdk25
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Set up JDK 22
        id: jdk22
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '22' }
      - name: Set up JDK 21
        id: jdk21
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Toolchain paths
        id: jdks
        run: echo "paths=${{ steps.jdk25.outputs.path }},${{ steps.jdk22.outputs.path }},${{ steps.jdk21.outputs.path }}" >> "$GITHUB_OUTPUT"

      - name: Test on JDK 25 (core)
        run: >-
          ./gradlew --no-daemon
          -Porg.gradle.java.installations.paths=${{ steps.jdks.outputs.paths }}
          :vgirpc:test

      # FFM shared-memory overlay: POSIX-only, so skip on Windows (no shm_open —
      # ShmFactory.available() is false there and the worker uses the pipe path).
      - name: Test on JDK 25 (FFM shared-memory overlay)
        if: runner.os != 'Windows'
        run: >-
          ./gradlew --no-daemon
          -Porg.gradle.java.installations.paths=${{ steps.jdks.outputs.paths }}
          :vgirpc:java22Test

      - name: Test on JDK 22 (FFM overlay on a real 22 runtime)
        if: runner.os != 'Windows'
        run: >-
          ./gradlew --no-daemon --rerun-tasks
          -Porg.gradle.java.installations.paths=${{ steps.jdks.outputs.paths }}
          -PtestJdk=22 :vgirpc:java22Test

      - name: Test on JDK 21 (core; shm disabled, pipe fallback)
        run: >-
          ./gradlew --no-daemon --rerun-tasks
          -Porg.gradle.java.installations.paths=${{ steps.jdks.outputs.paths }}
          -PtestJdk=21 :vgirpc:test

  # Real object-store protocol coverage. These stay out of the cross-platform
  # unit-test matrix because they require Docker, but are a required PR/push
  # job on Linux. RustFS validates SigV4; fake-gcs-server validates the GCS SDK
  # upload/download flow while explicitly not claiming signature validation.
  storage-integration:
    name: storage integration / rustfs + fake-gcs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run storage integration tests
        run: ./gradlew --no-daemon --continue storageIntegrationTest

  iroh-integration:
    name: native Iroh HTTP integration / Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out version-matched Rust bridge
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-rust
          ref: ${{ env.VGI_RPC_IROH_RUST_REV }}
          path: .ci/vgi-rpc-rust

      - name: Set up JDK 25 build toolchain
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21 runtime
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust bridge build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/vgi-rpc-rust -> target
          key: java-iroh-bridge-linux-x64

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-iroh-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-iroh-${{ runner.os }}-

      - name: Install Python worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'vgi-rpc[http] @ git+https://github.com/Query-farm/vgi-rpc-python.git@365395a6144256ec163b17cf9b755b9b5f6a386c' \
            'httpx2==2.9.1' waitress

      - name: Build pinned Iroh bridge
        working-directory: .ci/vgi-rpc-rust
        run: cargo build --locked --release -p vgi-iroh-bridge

      - name: Test typed HTTP, bearer auth, and Iroh identity (direct, no relay)
        run: |
          set -euo pipefail
          worker_log="$RUNNER_TEMP/vgi-http-worker.log"
          bridge_log="$RUNNER_TEMP/vgi-iroh-bridge.log"
          worker_pid=
          bridge_pid=
          cleanup() {
            exit_code=$?
            if [ -n "$bridge_pid" ]; then kill "$bridge_pid" 2>/dev/null || true; fi
            if [ -n "$worker_pid" ]; then kill "$worker_pid" 2>/dev/null || true; fi
            if [ "$exit_code" -ne 0 ]; then
              cat "$worker_log" "$bridge_log" 2>/dev/null || true
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT

          python tests/serve_iroh_http.py >"$worker_log" 2>&1 &
          worker_pid=$!
          for _ in $(seq 1 30); do
            grep -q '^PORT:' "$worker_log" && break
            kill -0 "$worker_pid" 2>/dev/null || break
            sleep 1
          done
          port=$(sed -n 's/^PORT://p' "$worker_log" | head -n 1)
          if [ -z "$port" ]; then cat "$worker_log"; exit 1; fi

          .ci/vgi-rpc-rust/target/release/vgi-iroh-bridge \
            --ephemeral --no-relay --print-direct-addresses \
            --http-upstream "http://127.0.0.1:$port" >"$bridge_log" 2>&1 &
          bridge_pid=$!
          for _ in $(seq 1 30); do
            grep -q '^DIRECT:' "$bridge_log" && break
            kill -0 "$bridge_pid" 2>/dev/null || break
            sleep 1
          done
          endpoint=$(grep -m1 -E '^[0-9a-f]{64}$' "$bridge_log" || true)
          direct_addresses=$(sed -n 's/^DIRECT://p' "$bridge_log" | paste -sd, -)
          if [ -z "$endpoint" ] || [ -z "$direct_addresses" ]; then cat "$bridge_log"; exit 1; fi

          VGI_IROH_HTTP_TEST_ENDPOINT="$endpoint" \
          VGI_IROH_HTTP_TEST_DIRECT_ADDRESSES="$direct_addresses" \
            ./gradlew --no-daemon :vgirpc-iroh:test \
              -Porg.gradle.java.installations.paths=${{ steps.jdk25.outputs.path }},${{ steps.jdk21.outputs.path }} \
              -PtestJdk=21 \
              --tests farm.query.vgirpc.iroh.OfficialIrohHttpIntegrationTest

  # Python-driven conformance suite: a Python driver (the vgi_rpc reference)
  # spawns the Java worker and asserts byte-for-byte wire compatibility. Fanned
  # out across transport groups so the lanes run in parallel and failures
  # isolate by mode. All lanes run on JDK 25 (the build toolchain + worker
  # runtime); the shm side-channel is exercised explicitly via the
  # "subprocess_shm" transport — where the Python client owns a POSIX segment
  # and batches ride shared memory — rather than implicitly by runtime JDK. The
  # Java-21 baseline runtime is covered by the JUnit `-PtestJdk=21` lane.
  #   * launcher    -> pipe/subprocess/unix, inline (no shm) wire
  #   * launcher+shm -> subprocess + POSIX shared-memory side-channel
  #   * http        -> HTTP transport
  conformance:
    name: conformance / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: launcher (pipe/unix, no shm)
            transports: pipe,subprocess,unix
            # Access-log verification rides this lane rather than a job of its
            # own: it is a pipe-transport run, and this lane already has the
            # reference driver installed. Running it on all three would just
            # repeat the same check.
            access_log: true
          - name: launcher + shm
            transports: subprocess_shm
          - name: http
            transports: http,http_externalize_always
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The Java worker tracks the *unreleased* Python reference (0.19.0+ on
      # main), which is ahead of PyPI's latest — so install vgi_rpc from source
      # off the default branch rather than `pip install vgi-rpc`.
      - name: Clone vgi-rpc-python reference
        run: git clone --depth 1 https://github.com/Query-farm/vgi-rpc-python.git "$RUNNER_TEMP/vgi-rpc-python"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # httpx2 2.12.0 stopped decoding a standard zstd Content-Encoding
          # while still advertising zstd. The compressed frame then reaches
          # PyArrow as if it were IPC ("negative continuation token"). Keep
          # the known-good reference client until that upstream regression is
          # fixed; this does not change the Java server's zstd contract.
          pip install "${RUNNER_TEMP}/vgi-rpc-python[http,cli,external,conformance,oauth,mtls]" \
            'httpx2==2.9.1' pytest pytest-timeout

      - name: Build conformance worker
        run: ./gradlew --no-daemon :conformance-worker:installDist

      - name: Run conformance suite (${{ matrix.transports }})
        env:
          CONFORMANCE_TRANSPORTS: ${{ matrix.transports }}
        run: python -m pytest tests/test_java_conformance.py -p no:cacheprovider -q --timeout=120

      # The suite above proves the wire; this proves the access-log record, which
      # nothing in CI checked until now — it was verified by hand, and drifted
      # anyway. --require-request-data is what gives it teeth: without it the
      # validator only checks request_data *when present*, so a worker that never
      # emits the field passes vacuously. This worker logs payloads by default
      # (no --access-log-debug needed), which is why it caught a request_data bug
      # the ports that default to omitting it logged straight past.
      #
      # Deliberately unfiltered: a --filter that excluded the zero-parameter
      # methods (void.*) would drop the empty-schema/no-row case, and that is the
      # exact shape a bad validator rule mis-rejected in 0.36.1. The per-test
      # timeout is raised off the 5s default because the first call also pays JVM
      # startup and JIT on a shared runner.
      - name: Verify access log (--require-request-data)
        if: matrix.access_log
        run: >-
          vgi-rpc-test
          --cmd "conformance-worker/build/install/conformance-worker/bin/conformance-worker --access-log $RUNNER_TEMP/java-access-log.jsonl"
          --access-log "$RUNNER_TEMP/java-access-log.jsonl"
          --require-request-data
          --timeout 30

      # The step above validates the *launcher* worker's log, where a whole
      # stream call is one dispatch and therefore one record. Over HTTP a stream
      # is a chain of independent requests — one /init and one /exchange per
      # continuation — and this server fired its dispatch hook only on the unary
      # path, so streams produced no records at all. The validator passed
      # regardless: it checks the records it is handed, and a log missing the
      # traffic that carries the bytes has nothing wrong with the records it
      # kept. Presence and shape are what has to be asserted, so this runs the
      # group that drives real producer / exchange / failing streams over HTTP
      # against a worker started with --access-log and reads its log back.
      #
      # Named as its own step rather than left to the full pytest run in this
      # lane so the check is visible in the workflow, and so a regression here
      # reports as itself rather than as one red line in a suite of a thousand.
      - name: Verify HTTP stream access-log records
        if: matrix.name == 'http'
        run: >-
          python -m pytest tests/test_java_conformance.py
          -k TestHttpStreamAccessLog -p no:cacheprovider -q --timeout=120
